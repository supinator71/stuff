# Static site — no build step. Works the same on Cloudflare Pages, Vercel or
# GitHub Pages; only the headers below are Netlify-specific syntax.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# A Content-Security-Policy is deliberately NOT set here.
#
# The site's own code needs nothing beyond 'self' — there is no inline script
# anywhere. But AdSense injects scripts, frames and images from a long and
# changing list of Google and ad-partner hosts, and a CSP that is even slightly
# too tight silently kills your fill rate, which is very hard to notice.
#
# If you want one, add it AFTER ads are live and verified, start from Google's
# published list of AdSense domains, and watch your fill rate for a week.

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
